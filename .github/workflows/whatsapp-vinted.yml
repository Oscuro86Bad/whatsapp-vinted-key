name: WhatsApp Vinted Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # fallback (GitHub lo rallenta, il loop self-dispatch fa il ritmo reale)
  workflow_dispatch: {}

concurrency:
  group: ws-vinted-listings-monitor
  cancel-in-progress: false

jobs:
  vinted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore listings state
        uses: actions/cache@v4
        with:
          path: ws-vinted-state.json
          key: ws-vinted-listings-${{ github.run_id }}
          restore-keys: |
            ws-vinted-listings-

      - name: Check Vinted new listings
        env:
          TRIGGER_TOKEN: ${{ secrets.SELF_TRIGGER_TOKEN }}
        run: pwsh -NoProfile -File ./whatsapp.ps1

      # GitHub rallenta i cron schedulati: auto-lancio del run successivo (~5 min reali)
      - name: Loop (next check in ~4 min)
        env:
          TRIGGER_TOKEN: ${{ secrets.SELF_TRIGGER_TOKEN }}
        run: |
          sleep 240
          curl -s -X POST \
            -H "Authorization: token $TRIGGER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/whatsapp-vinted.yml/dispatches" \
            -d '{"ref":"main"}' > /dev/null
          echo "Prossima verifica programmata."
